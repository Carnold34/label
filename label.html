<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F9">
<title>Sample labels</title>
<style>
  :root {
    --bg: #F6F7F9; --card: #FFFFFF; --card-hi: #EEF3F9; --line: #D3D9E1;
    --text: #1A2230; --dim: #5D6878; --accent: #1F6FB8; --accent-ink: #FFFFFF;
    --ok: #2E9A5E; --bad: #C8452F; --warn: #C98A12;
    --mono: ui-monospace, "Roboto Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.35 system-ui, Roboto, "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app { max-width: 640px; margin: 0 auto; padding: 12px 12px 32px; display: flex; flex-direction: column; gap: 12px; }
  .bar { display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot.on { background: var(--ok); } .dot.busy { background: var(--warn); }
  .who { font-size: 13px; color: var(--dim); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  button { font: inherit; color: var(--text); background: var(--card-hi); border: 1px solid var(--line);
           border-radius: 10px; padding: 10px 14px; min-height: 46px; cursor: pointer; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; }
  button.ghost { background: transparent; }
  button.sm { min-height: 40px; padding: 6px 12px; font-size: 14px; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  input, select { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
                  border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 46px; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .full { grid-column: 1 / -1; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--dim); min-width: 0; }
  .inrow { display: flex; gap: 8px; }
  .inrow input { flex: 1; min-width: 0; }
  .inrow button { flex: none; }
  .sep { border: 0; border-top: 1px solid var(--line); margin: 2px 0; grid-column: 1 / -1; }

  .preview { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  canvas#label { width: 100%; height: auto; image-rendering: pixelated; display: block; }
  .warn { color: var(--bad); font-size: 13px; min-height: 1em; }

  .qty { display: flex; align-items: center; gap: 8px; }
  .qty output { font-family: var(--mono); min-width: 3ch; text-align: center; font-size: 18px; }

  details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  summary { cursor: pointer; font-size: 14px; color: var(--dim); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .hist { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; max-height: 40vh; overflow-y: auto; }
  .hrow { display: flex; justify-content: space-between; gap: 10px; text-align: left; background: var(--card);
          min-height: 44px; font-size: 14px; }
  .hrow span:last-child { color: var(--dim); font-size: 12px; white-space: nowrap; }
  #log { font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: pre-wrap; max-height: 22vh; overflow-y: auto; margin: 10px 0 0; }
  .err { color: var(--bad); }
  .banner { background: #FBECE9; border: 1px solid var(--bad); color: #7A2414; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">

  <div class="bar">
    <span class="dot" id="dot"></span>
    <span class="who" id="who">Printer not connected</span>
    <button class="sm" id="btnConnect">Connect</button>
  </div>

  <div class="banner hidden" id="unsupported">No Web Bluetooth here. Use Chrome on Android over HTTPS.</div>

  <div class="form">
    <label class="f">Project ID<input id="f_proj" maxlength="16" autocomplete="off"></label>
    <label class="f">Logger<input id="f_logger" maxlength="20" autocomplete="off"></label>
    <hr class="sep">
    <label class="f">Boring ID<input id="f_boring" maxlength="10" autocomplete="off"></label>
    <label class="f">Sample ID<input id="f_sample" maxlength="10" autocomplete="off"></label>
    <label class="f full">GPS
      <span class="inrow"><input id="f_gps" maxlength="24" inputmode="decimal" autocomplete="off"><button class="sm" id="btnGps">Locate</button></span>
    </label>
    <label class="f">Depth from (ft)<input id="f_d1" type="number" inputmode="decimal" step="0.1" min="0"></label>
    <label class="f">Depth to (ft)<input id="f_d2" type="number" inputmode="decimal" step="0.1" min="0"></label>
    <label class="f full">Description (QR only)<input id="f_desc" maxlength="32" list="descList" autocomplete="off"></label>
    <datalist id="descList"></datalist>
    <label class="f full">Date and time
      <span class="inrow"><input id="f_time" type="datetime-local"><button class="sm" id="btnNow">Now</button></span>
    </label>
  </div>

  <div class="preview"><canvas id="label" width="384" height="240"></canvas></div>
  <div class="warn" id="warn"></div>

  <div class="qty">
    <button class="sm" id="qtyMinus" aria-label="Fewer copies">-</button>
    <output id="qty">1</output>
    <button class="sm" id="qtyPlus" aria-label="More copies">+</button>
    <button class="primary" id="btnPrint" style="flex:1" disabled>Print</button>
  </div>

  <details id="histBox">
    <summary id="histSum">Printed samples (0)</summary>
    <div class="grid2">
      <button class="sm" id="btnCsv">Export CSV</button>
      <button class="sm ghost" id="btnClear">Clear list</button>
    </div>
    <div class="hist" id="hist"></div>
  </details>

  <details>
    <summary>Printer settings and log</summary>
    <div class="grid2">
      <label class="f">Print width (mm, max 48)<input id="mmW" type="number" min="10" max="48" step="1"></label>
      <label class="f">Label height (mm)<input id="mmH" type="number" min="10" max="80" step="1"></label>
      <label class="f">Print direction
        <select id="dir"><option value="auto">auto (from printer)</option><option value="top">top</option><option value="left">left</option></select>
      </label>
      <label class="f">Darkness (1 to 5)
        <select id="density"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
      </label>
      <label class="f">Print task
        <select id="task">
          <option value="auto">auto-detect</option><option value="B1">B1</option><option value="B21_V1">B21_V1</option>
          <option value="D110">D110</option><option value="D110M_V4">D110M_V4</option><option value="D11_V1">D11_V1</option>
        </select>
      </label>
    </div>
    <div class="grid2">
      <button class="sm ghost" id="btnDisconnect">Disconnect</button>
      <button class="sm ghost" id="btnFeed">Test print (blank)</button>
    </div>
    <pre id="log"></pre>
  </details>

</div>

<!-- Protocol library (niimbluelib, MIT, pinned 0.0.1-alpha.40). Local copy first, CDN as fallback. -->
<script src="./niimbluelib.min.js"
        onerror="var s=document.createElement('script');s.src='https://unpkg.com/@mmote/niimbluelib@0.0.1-alpha.40/dist/umd/niimbluelib.min.js';document.head.appendChild(s);"></script>

<script>
/* Borehole sample labels. Form -> 384 x 240 dot bitmap -> NIIMBOT B1 over Web Bluetooth.
   Everything on the label is also inside the QR code as plain text, so a label can be
   read years later with any scanner and no network. */

const DOTS_PER_MM = 8;
const MAX_W_DOTS = 384;
const DEFAULTS = { mmW: 48, mmH: 30, dir: "auto", task: "auto", density: 3 };
let headDots = MAX_W_DOTS;

/* QR encoder: byte mode, EC level M, versions 1-10. */
const QR = (() => {
  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function () {
    let x = 1;
    for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  const mul = (a, b) => (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]];

  const EC = {
    1: [16, 10, [[1, 16]]],   2: [28, 16, [[1, 28]]],   3: [44, 26, [[1, 44]]],
    4: [64, 18, [[2, 32]]],   5: [86, 24, [[2, 43]]],   6: [108, 16, [[4, 27]]],
    7: [124, 18, [[4, 31]]],  8: [154, 22, [[2, 38], [2, 39]]],
    9: [182, 22, [[3, 36], [2, 37]]], 10: [216, 26, [[4, 43], [1, 44]]],
  };
  const ALIGN = {
    1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30],
    6: [6, 34], 7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50],
  };

  function rsGen(n) {
    let poly = [1];
    for (let i = 0; i < n; i++) {
      const next = new Array(poly.length + 1).fill(0);
      for (let j = 0; j < poly.length; j++) { next[j] ^= poly[j]; next[j + 1] ^= mul(poly[j], EXP[i]); }
      poly = next;
    }
    return poly;
  }
  function rsEncode(data, ecLen) {
    const gen = rsGen(ecLen);
    const res = new Uint8Array(data.length + ecLen);
    res.set(data);
    for (let i = 0; i < data.length; i++) {
      const coef = res[i];
      if (coef !== 0) for (let j = 1; j <= ecLen; j++) res[i + j] ^= mul(gen[j], coef);
    }
    return res.slice(data.length);
  }
  function pickVersion(len) {
    for (let v = 1; v <= 10; v++) {
      if (4 + (v <= 9 ? 8 : 16) + len * 8 <= EC[v][0] * 8) return v;
    }
    throw new Error("payload too long (max 213 bytes at version 10, EC level M)");
  }
  function bitstream(bytes, version) {
    const bits = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); };
    push(0b0100, 4);
    push(bytes.length, version <= 9 ? 8 : 16);
    for (const b of bytes) push(b, 8);
    const cap = EC[version][0] * 8;
    push(0, Math.min(4, cap - bits.length));
    while (bits.length % 8 !== 0) bits.push(0);
    const pad = [0xEC, 0x11];
    let k = 0;
    while (bits.length < cap) push(pad[k++ % 2], 8);
    const out = new Uint8Array(cap / 8);
    for (let i = 0; i < out.length; i++) {
      let v = 0;
      for (let j = 0; j < 8; j++) v = (v << 1) | bits[i * 8 + j];
      out[i] = v;
    }
    return out;
  }
  function interleave(data, version) {
    const [, ecLen, groups] = EC[version];
    const blocks = [];
    let off = 0;
    for (const [n, dc] of groups) {
      for (let i = 0; i < n; i++) { blocks.push({ d: data.slice(off, off + dc) }); off += dc; }
    }
    for (const b of blocks) b.e = rsEncode(b.d, ecLen);
    const maxD = Math.max(...blocks.map(b => b.d.length));
    const out = [];
    for (let i = 0; i < maxD; i++) for (const b of blocks) if (i < b.d.length) out.push(b.d[i]);
    for (let i = 0; i < ecLen; i++) for (const b of blocks) out.push(b.e[i]);
    return Uint8Array.from(out);
  }
  function maskBit(mask, r, c) {
    switch (mask) {
      case 0: return (r + c) % 2 === 0;
      case 1: return r % 2 === 0;
      case 2: return c % 3 === 0;
      case 3: return (r + c) % 3 === 0;
      case 4: return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0;
      case 5: return (r * c) % 2 + (r * c) % 3 === 0;
      case 6: return ((r * c) % 2 + (r * c) % 3) % 2 === 0;
      default: return ((r + c) % 2 + (r * c) % 3) % 2 === 0;
    }
  }
  function build(codewords, version, mask) {
    const size = version * 4 + 17;
    const m = Array.from({ length: size }, () => new Int8Array(size).fill(-1));
    const set = (r, c, v) => { if (r >= 0 && c >= 0 && r < size && c < size) m[r][c] = v; };
    const finder = (r0, c0) => {
      for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {
        const ring = (r >= 0 && r <= 6 && c >= 0 && c <= 6) && (r === 0 || r === 6 || c === 0 || c === 6);
        const core = r >= 2 && r <= 4 && c >= 2 && c <= 4;
        set(r0 + r, c0 + c, (ring || core) ? 1 : 0);
      }
    };
    finder(0, 0); finder(0, size - 7); finder(size - 7, 0);
    for (let i = 8; i < size - 8; i++) { set(6, i, i % 2 === 0 ? 1 : 0); set(i, 6, i % 2 === 0 ? 1 : 0); }
    for (const r of ALIGN[version]) for (const c of ALIGN[version]) {
      if ((r === 6 && c === 6) || (r === 6 && c === size - 7) || (r === size - 7 && c === 6)) continue;
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
        set(r + dr, c + dc, Math.max(Math.abs(dr), Math.abs(dc)) === 1 ? 0 : 1);
      }
    }
    const fmtData = (0b00 << 3) | mask;              // 00 = EC level M
    let rem = fmtData;
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >> 9) * 0x537);
    const fmt = ((fmtData << 10) | rem) ^ 0x5412;
    for (let i = 0; i <= 5; i++) set(i, 8, (fmt >> i) & 1);
    set(7, 8, (fmt >> 6) & 1);
    set(8, 8, (fmt >> 7) & 1);
    set(8, 7, (fmt >> 8) & 1);
    for (let i = 9; i <= 14; i++) set(8, 14 - i, (fmt >> i) & 1);
    for (let i = 0; i <= 7; i++) set(8, size - 1 - i, (fmt >> i) & 1);
    for (let i = 8; i <= 14; i++) set(size - 15 + i, 8, (fmt >> i) & 1);
    set(size - 8, 8, 1);
    if (version >= 7) {
      let vr = version;
      for (let i = 0; i < 12; i++) vr = (vr << 1) ^ ((vr >> 11) * 0x1F25);
      const vbits = (version << 12) | vr;
      for (let i = 0; i < 18; i++) {
        const bit = (vbits >> i) & 1;
        const a = size - 11 + i % 3, b = Math.floor(i / 3);
        set(a, b, bit); set(b, a, bit);
      }
    }
    let bi = 0;
    const nextBit = () => {
      if (bi >= codewords.length * 8) return 0;
      const b = (codewords[bi >> 3] >> (7 - (bi & 7))) & 1;
      bi++;
      return b;
    };
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) {
        for (let j = 0; j < 2; j++) {
          const c = right - j;
          const upward = ((right + 1) & 2) === 0;
          const r = upward ? size - 1 - vert : vert;
          if (m[r][c] !== -1) continue;
          m[r][c] = nextBit() ^ (maskBit(mask, r, c) ? 1 : 0);
        }
      }
    }
    return m;
  }
  function penalty(m) {
    const size = m.length;
    let score = 0;
    const rs = (run) => run >= 5 ? 3 + (run - 5) : 0;
    for (let r = 0; r < size; r++) {
      let run = 1;
      for (let c = 1; c < size; c++) { if (m[r][c] === m[r][c - 1]) run++; else { score += rs(run); run = 1; } }
      score += rs(run);
    }
    for (let c = 0; c < size; c++) {
      let run = 1;
      for (let r = 1; r < size; r++) { if (m[r][c] === m[r - 1][c]) run++; else { score += rs(run); run = 1; } }
      score += rs(run);
    }
    for (let r = 0; r < size - 1; r++) for (let c = 0; c < size - 1; c++) {
      const v = m[r][c];
      if (v === m[r][c + 1] && v === m[r + 1][c] && v === m[r + 1][c + 1]) score += 3;
    }
    const pat = [1, 0, 1, 1, 1, 0, 1, 0, 0, 0, 0], rev = pat.slice().reverse();
    const hits = (arr) => {
      let n = 0;
      for (let i = 0; i + 11 <= arr.length; i++) {
        let a = true, b = true;
        for (let j = 0; j < 11; j++) { if (arr[i + j] !== pat[j]) a = false; if (arr[i + j] !== rev[j]) b = false; }
        if (a) n++;
        if (b) n++;
      }
      return n;
    };
    for (let r = 0; r < size; r++) score += 40 * hits(Array.from(m[r]));
    for (let c = 0; c < size; c++) score += 40 * hits(m.map(row => row[c]));
    let dark = 0;
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) dark += m[r][c];
    score += Math.floor(Math.abs(dark * 100 / (size * size) - 50) / 5) * 10;
    return score;
  }
  function encode(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    const version = pickVersion(bytes.length);
    const cw = interleave(bitstream(bytes, version), version);
    let best = null;
    for (let mask = 0; mask < 8; mask++) {
      const m = build(cw, version, mask);
      const p = penalty(m);
      if (best === null || p < best.p) best = { p, mask, m };
    }
    return { size: version * 4 + 17, version, mask: best.mask, modules: best.m };
  }
  return { encode };
})();

/* ---------- storage, state ---------- */
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("nb." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("nb." + k, JSON.stringify(v)); } catch {} },
};
const cfg = Object.assign({}, DEFAULTS, store.get("cfg", {}));
let qty = 1, client = null, busy = false, timeEdited = false;
let printerDir = "top";
let history = store.get("samples", []);
let lastInfo = null;

function log(msg, isErr) {
  const el = $("log"), line = document.createElement("span");
  line.textContent = `${new Date().toTimeString().slice(0, 8)}  ${msg}\n`;
  if (isErr) line.className = "err";
  el.appendChild(line); el.scrollTop = el.scrollHeight;
}

/* ---------- form ---------- */
const FIELDS = ["proj", "logger", "boring", "sample", "gps", "d1", "d2", "desc", "time"];
const STICKY = ["proj", "logger", "boring", "gps", "sample", "d1", "d2", "desc"];

const pad = (n) => String(n).padStart(2, "0");
function nowLocal() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const fmtDepth = (v) => v === "" || v === null || isNaN(Number(v)) ? "" : Number(v).toFixed(1);

function readForm() {
  const v = {};
  for (const f of FIELDS) v[f] = $("f_" + f).value.trim();
  const a = fmtDepth(v.d1), b = fmtDepth(v.d2);
  v.depth = a && b ? `${a}-${b} ft` : a ? `${a} ft` : "";
  v.when = v.time.replace("T", " ");
  return v;
}

function payload(v) {
  const rows = [
    ["Project", v.proj], ["Boring", v.boring], ["Sample", v.sample], ["Depth", v.depth],
    ["Date", v.when], ["GPS", v.gps], ["Desc", v.desc], ["Logger", v.logger],
  ];
  return rows.filter(r => r[1]).map(r => `${r[0]}: ${r[1]}`).join("\n");
}

function missing(v) {
  const m = [];
  if (!v.proj) m.push("Project ID");
  if (!v.boring) m.push("Boring ID");
  if (!v.sample) m.push("Sample ID");
  if (!v.depth) m.push("depth");
  if (!v.when) m.push("date");
  return m;
}

function nextSampleId(id) {
  const m = id.match(/^(.*?)(\d+)(\D*)$/);
  if (!m) return id;
  const n = String(Number(m[2]) + 1).padStart(m[2].length, "0");
  return m[1] + n + m[3];
}

/* ---------- rendering ---------- */
const cv = $("label");
const ctx = cv.getContext("2d", { willReadFrequently: true });
const SANS = `Roboto, "Segoe UI", Arial, sans-serif`;

function fitFont(text, weight, size, maxW, minSize) {
  ctx.font = `${weight} ${size}px ${SANS}`;
  while (size > minSize && ctx.measureText(text).width > maxW) { size -= 1; ctx.font = `${weight} ${size}px ${SANS}`; }
  return size;
}
function clip(text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  while (text.length > 1 && ctx.measureText(text + "\u2026").width > maxW) text = text.slice(0, -1);
  return text + "\u2026";
}
function wrap2(text, maxW) {
  if (ctx.measureText(text).width <= maxW) return [text];
  const words = text.split(/\s+/);
  let first = "";
  while (words.length && ctx.measureText((first ? first + " " : "") + words[0]).width <= maxW) first += (first ? " " : "") + words.shift();
  if (!first) return [clip(text, maxW)];
  return [first, clip(words.join(" "), maxW)];
}

function render(v) {
  let W = Math.min(Math.round(cfg.mmW * DOTS_PER_MM), headDots);
  const H = Math.round(cfg.mmH * DOTS_PER_MM);
  cv.width = W; cv.height = H;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  if (!v) { flatten(); return null; }

  // QR block: whole dots per module, 4-module quiet zone, kept at 3+ dots per module when it fits
  const text = payload(v);
  const qr = QR.encode(text);
  const QUIET = 4, total = qr.size + QUIET * 2;
  let s = Math.floor(Math.min(H - 8, 176) / total);
  if (s < 3 && total * 3 <= Math.min(H - 8, 200)) s = 3;
  s = Math.max(2, s);
  const qrPx = total * s, qx = 2, qy = Math.floor((H - qrPx) / 2);
  ctx.fillStyle = "#000";
  for (let r = 0; r < qr.size; r++) for (let c = 0; c < qr.size; c++)
    if (qr.modules[r][c] === 1) ctx.fillRect(qx + (c + QUIET) * s, qy + (r + QUIET) * s, s, s);

  // Text column: every line shrinks to fit its width, never truncates
  const tx = qx + qrPx + 2, tw = W - tx - 4;
  const lines = [];
  const add = (t, weight, size) => { if (t) lines.push({ t, weight, size: fitFont(t, weight, size, tw, 9) }); };
  add(v.proj, 600, 22);
  add([v.boring, v.sample].filter(Boolean).join("  "), 700, 32);
  add(v.depth, 700, 28);
  add(v.when, 400, 20);
  add(v.gps, 400, 19);
  add(v.logger, 400, 20);

  // Shrink the whole stack together if it is taller than the label
  const gap = 1.16, avail = H - 10;
  const tot = lines.reduce((a, l) => a + l.size * gap, 0);
  const k = tot > avail ? avail / tot : 1;
  let y = Math.round((H - tot * k) / 2);
  ctx.textBaseline = "alphabetic";
  for (const l of lines) {
    const sz = fitFont(l.t, l.weight, Math.max(9, Math.floor(l.size * k)), tw, 8);
    y += Math.round(Math.max(9, Math.floor(l.size * k)) * gap);
    ctx.fillText(l.t, tx, y - Math.round(sz * 0.2));
  }
  flatten();
  return { W, H, version: qr.version, scale: s, bytes: new TextEncoder().encode(text).length };
}

function flatten() {
  const d = ctx.getImageData(0, 0, cv.width, cv.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const v = (0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]) < 140 ? 0 : 255;
    p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = 255;
  }
  ctx.putImageData(d, 0, 0);
}

function refresh() {
  const v = readForm();
  for (const f of STICKY) store.set("f_" + f, $("f_" + f).value);
  let w = "";
  try {
    lastInfo = render(v);
    if (lastInfo && lastInfo.scale < 3) w = "QR is very fine; shorten the description";
  } catch (e) { lastInfo = null; render(null); w = "Too much text for the QR code; shorten the description"; }
  const m = missing(v);
  if (!w && m.length) w = "Needs " + m.join(", ");
  $("warn").textContent = w;
  updateButtons();
}

function updateButtons() {
  const v = readForm();
  $("btnPrint").disabled = !(client && !busy && lastInfo && !missing(v).length);
  $("btnFeed").disabled = !(client && !busy);
  $("qty").textContent = String(qty);
}

/* ---------- GPS ---------- */
function locate() {
  if (!navigator.geolocation) { log("no geolocation in this browser", true); return; }
  $("btnGps").disabled = true; $("btnGps").textContent = "…";
  navigator.geolocation.getCurrentPosition(
    (p) => {
      $("f_gps").value = `${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;
      log(`GPS fix, accuracy ${Math.round(p.coords.accuracy)} m`);
      $("btnGps").disabled = false; $("btnGps").textContent = "Locate"; refresh();
    },
    (e) => { log("GPS failed: " + e.message, true); $("btnGps").disabled = false; $("btnGps").textContent = "Locate"; },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
  );
}

/* ---------- history ---------- */
function drawHistory() {
  $("histSum").textContent = `Printed samples (${history.length})`;
  const el = $("hist"); el.textContent = "";
  for (const h of history.slice().reverse().slice(0, 50)) {
    const b = document.createElement("button"); b.className = "hrow";
    const a = document.createElement("span"); a.textContent = `${h.boring} ${h.sample}  ${h.depth}`;
    const c = document.createElement("span"); c.textContent = h.when;
    b.append(a, c);
    b.addEventListener("click", () => loadEntry(h));
    el.appendChild(b);
  }
  const dl = $("descList"); dl.textContent = "";
  [...new Set(history.slice().reverse().map(h => h.desc).filter(Boolean))].slice(0, 12)
    .forEach(d => { const o = document.createElement("option"); o.value = d; dl.appendChild(o); });
}
function loadEntry(h) {
  for (const f of FIELDS) if (h[f] !== undefined) $("f_" + f).value = h[f];
  timeEdited = true; refresh(); window.scrollTo({ top: 0, behavior: "smooth" });
}
function exportCsv() {
  const cols = [["printed", "Printed"], ["proj", "Project"], ["boring", "Boring"], ["sample", "Sample"],
    ["d1", "Depth from (ft)"], ["d2", "Depth to (ft)"], ["when", "Sample date/time"], ["lat", "Latitude"],
    ["lon", "Longitude"], ["desc", "Description"], ["logger", "Logger"], ["copies", "Copies"]];
  const q = (x) => `"${String(x ?? "").replace(/"/g, '""')}"`;
  const rows = [cols.map(c => q(c[1])).join(",")];
  for (const h of history) {
    const [lat, lon] = (h.gps || "").split(",").map(s => s.trim());
    const r = Object.assign({}, h, { lat: lat || "", lon: lon || "" });
    rows.push(cols.map(c => q(r[c[0]])).join(","));
  }
  const blob = new Blob(["\ufeff" + rows.join("\r\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `samples_${nowLocal().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ---------- printer ---------- */
function requireLib() {
  const lib = window.niimbluelib || null;
  if (!lib || !lib.NiimbotBluetoothClient) throw new Error("niimbluelib failed to load: put niimbluelib.min.js beside this file, or check signal");
  return lib;
}
const effectiveDir = () => cfg.dir === "auto" ? printerDir : cfg.dir;
function setDot(state) { $("dot").className = "dot" + (state === "on" ? " on" : state === "busy" ? " busy" : ""); }

async function connect() {
  try {
    const { NiimbotBluetoothClient } = requireLib();
    busy = true; setDot("busy"); updateButtons();
    client = new NiimbotBluetoothClient();
    await client.connect();
    let name = "Printer";
    try {
      const md = client.getModelMetadata && client.getModelMetadata();
      if (md) {
        if (md.model) name = md.model;
        if (md.printDirection) printerDir = md.printDirection;
        if (md.printheadPixels) headDots = md.printheadPixels;
      }
    } catch {}
    let task = "?"; try { task = client.getPrintTaskType() || "?"; } catch {}
    $("who").textContent = `${name} connected`;
    setDot("on");
    log(`connected (${name}), task ${task}, direction ${printerDir}, head ${headDots} dots`);
    client.addEventListener && client.addEventListener("disconnect", () => {
      client = null; setDot("off"); $("who").textContent = "Printer not connected"; updateButtons(); log("printer disconnected");
    });
  } catch (e) {
    client = null; setDot("off"); $("who").textContent = "Printer not connected";
    log("connect failed: " + (e && e.message ? e.message : e), true);
    if (String(e).includes("cancel")) log("chooser empty? turn on Location, close the NIIMBOT app");
  } finally { busy = false; refresh(); }
}
async function disconnect() {
  try { if (client) await client.disconnect(); } catch (e) { log("disconnect: " + e.message, true); }
  client = null; setDot("off"); $("who").textContent = "Printer not connected"; updateButtons();
}

async function print(copies, isTest) {
  if (!client) return;
  const { ImageEncoder } = requireLib();
  const v = readForm();
  busy = true; setDot("busy"); updateButtons();
  let task = null;
  try {
    const encoded = ImageEncoder.encodeCanvas(cv, effectiveDir());
    let taskName = cfg.task;
    if (taskName === "auto") { try { taskName = client.getPrintTaskType() || "B1"; } catch { taskName = "B1"; } }
    log(`printing ${copies} as ${taskName}, direction ${effectiveDir()}, darkness ${cfg.density}`);
    task = client.abstraction.newPrintTask(taskName, {
      totalPages: copies, density: Number(cfg.density), statusPollIntervalMs: 100, statusTimeoutMs: 8000,
    });
    await task.printInit();
    await task.printPage(encoded, copies);
    await task.waitForFinished();
    log("done");
    if (!isTest) {
      history.push(Object.assign({}, v, { printed: new Date().toISOString(), copies }));
      store.set("samples", history);
      drawHistory();
      $("f_sample").value = nextSampleId(v.sample);
      const a = parseFloat(v.d1), b = parseFloat(v.d2);
      if (!isNaN(a) && !isNaN(b) && b > a) {
        $("f_d1").value = b;
        $("f_d2").value = Math.round((b + (b - a)) * 100) / 100;
      }
      $("f_desc").value = "";
      $("f_time").value = nowLocal(); timeEdited = false;
      qty = 1;
    }
  } catch (e) {
    log("print failed: " + (e && e.message ? e.message : e), true);
    log("if it half-printed: power-cycle the printer, then reconnect");
  } finally {
    try { if (task) await task.printEnd(); } catch (e) { log("printEnd: " + e.message, true); }
    busy = false; setDot(client ? "on" : "off"); refresh();
  }
}

/* ---------- wire-up ---------- */
for (const f of STICKY) { const v = store.get("f_" + f, ""); if (v) $("f_" + f).value = v; }
$("f_time").value = nowLocal();
for (const f of FIELDS) $("f_" + f).addEventListener("input", () => { if (f === "time") timeEdited = true; refresh(); });
setInterval(() => { if (!timeEdited && $("f_time").value !== nowLocal()) { $("f_time").value = nowLocal(); refresh(); } }, 15000);
$("btnNow").addEventListener("click", () => { $("f_time").value = nowLocal(); timeEdited = false; refresh(); });
$("btnGps").addEventListener("click", locate);

["mmW", "mmH"].forEach(k => {
  $(k).value = cfg[k];
  $(k).addEventListener("change", () => { const v = parseFloat($(k).value); if (v > 0) { cfg[k] = v; store.set("cfg", cfg); refresh(); } });
});
for (const k of ["dir", "task", "density"]) {
  $(k).value = String(cfg[k]);
  $(k).addEventListener("change", () => { cfg[k] = k === "density" ? Number($(k).value) : $(k).value; store.set("cfg", cfg); });
}
$("btnConnect").addEventListener("click", connect);
$("btnDisconnect").addEventListener("click", disconnect);
$("btnPrint").addEventListener("click", () => print(qty));
$("btnFeed").addEventListener("click", () => { render(null); print(1, true); });
$("qtyPlus").addEventListener("click", () => { qty = Math.min(20, qty + 1); updateButtons(); });
$("qtyMinus").addEventListener("click", () => { qty = Math.max(1, qty - 1); updateButtons(); });
$("btnCsv").addEventListener("click", exportCsv);
$("btnClear").addEventListener("click", () => {
  if (confirm("Clear the printed sample list on this phone? Export the CSV first.")) { history = []; store.set("samples", history); drawHistory(); }
});

if (!navigator.bluetooth) { $("unsupported").classList.remove("hidden"); $("btnConnect").disabled = true; }
if (location.protocol !== "https:" && location.hostname !== "localhost") log("Web Bluetooth needs HTTPS", true);
if (!$("f_gps").value) locate();

drawHistory();
refresh();
</script>
</body>
</html>
